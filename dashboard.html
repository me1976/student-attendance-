<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة إدارة الغياب</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');
*{box-sizing:border-box}
body{margin:0;font-family:'Tajawal',sans-serif;background:#f1f5f9;color:#0f172a}
.top{background:#0f172a;color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
.top h1{font-size:20px;margin:0}.top a{color:#fff;text-decoration:none;background:#334155;padding:9px 12px;border-radius:9px}
.wrap{max-width:1180px;margin:auto;padding:18px}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tab{border:0;background:#e2e8f0;padding:10px 16px;border-radius:10px;font-family:inherit;font-weight:800;cursor:pointer}
.tab.active{background:#1d4ed8;color:#fff}
.panel{display:none}.panel.active{display:block}
.card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.06);margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{font-size:13px;color:#64748b;font-weight:700}
select,input{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:9px;font-family:inherit;font-size:15px;background:#fff}
.btn{border:0;border-radius:9px;padding:9px 12px;background:#1d4ed8;color:#fff;font-family:inherit;font-weight:800;cursor:pointer}
.btn.secondary{background:#475569}.btn.danger{background:#dc2626}.btn.green{background:#16a34a}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.kpi{background:#fff;padding:14px;border-radius:12px}.kpi strong{display:block;font-size:26px;color:#1d4ed8}
table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:10px;border-bottom:1px solid #e2e8f0;text-align:right;font-size:14px}th{background:#f8fafc}
.empty{text-align:center;color:#64748b;padding:20px}.muted{color:#64748b}
.student-toolbar{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.add-form{display:grid;grid-template-columns:2fr 1fr auto;gap:8px}
.inline-actions{display:flex;gap:6px;flex-wrap:wrap}
.badge{display:inline-block;padding:4px 9px;border-radius:999px;background:#e2e8f0;font-size:12px}
.badge.red{background:#fee2e2;color:#b91c1c}.rank{font-weight:800;color:#1d4ed8}
.history-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.section-title{font-size:17px;font-weight:800;margin:0 0 12px}
@media(max-width:800px){
  .wrap{padding:10px}.grid2,.filters,.student-toolbar,.add-form,.kpis{grid-template-columns:1fr}
  table{display:block;overflow-x:auto;white-space:nowrap}.top h1{font-size:17px}
}
@media print{
  .top,.tabs,#studentsPanel,#analyticsPanel,.no-print{display:none!important}
  .wrap{padding:0}.card{box-shadow:none}.panel{display:block!important}body{background:#fff}
}
</style>
</head>
<body>
<div class="top">
  <h1>لوحة إدارة الغياب</h1>
  <a href="index.html">العودة لكشف الغياب</a>
</div>

<div class="wrap">
  <div class="tabs">
    <button id="tabReports" class="tab active" onclick="showTab('reports')">الغياب اليومي</button>
    <button id="tabStudents" class="tab" onclick="showTab('students')">إدارة الطلاب</button>
    <button id="tabAnalytics" class="tab" onclick="showTab('analytics')">المتابعة</button>
  </div>

  <div id="reportsPanel" class="panel active">
    <div class="card">
      <div class="filters">
        <div>
          <label>التاريخ</label>
          <select id="dateFilter" onchange="loadReport()"></select>
        </div>
        <div>
          <label>الصف</label>
          <select id="classFilter" onchange="loadReport()"></select>
        </div>
      </div>
      <div class="inline-actions no-print" style="margin-top:10px">
        <button class="btn secondary" onclick="window.print()">🖨️ طباعة</button>
      </div>
    </div>

    <div class="kpis">
      <div class="kpi"><span class="muted">عدد الغائبين</span><strong id="kpiCount">0</strong></div>
      <div class="kpi"><span class="muted">الصفوف التي فيها غياب</span><strong id="kpiClasses">0</strong></div>
    </div>

    <div class="card">
      <table>
        <thead><tr><th>الصف</th><th>اسم الطالب</th></tr></thead>
        <tbody id="reportBody"><tr><td colspan="2" class="empty">لا توجد سجلات</td></tr></tbody>
      </table>
    </div>
  </div>

  <div id="studentsPanel" class="panel">
    <div class="card">
      <div class="student-toolbar">
        <div>
          <label>عرض طلاب الصف</label>
          <select id="studentClassFilter" onchange="renderStudents()"></select>
        </div>
        <div>
          <label>بحث بالاسم</label>
          <input id="studentSearch" placeholder="اكتب جزءًا من الاسم" oninput="renderStudents()">
        </div>
      </div>
      <div class="add-form">
        <input id="newName" placeholder="اسم الطالب الجديد">
        <select id="newClass"></select>
        <button class="btn green" onclick="addStudent()">إضافة طالب</button>
      </div>
    </div>
    <div class="card">
      <table>
        <thead><tr><th>الاسم</th><th>الصف</th><th>نقل</th><th>إجراء</th></tr></thead>
        <tbody id="studentsBody"></tbody>
      </table>
    </div>
  </div>

  <div id="analyticsPanel" class="panel">
    <div class="grid2">
      <div class="card">
        <h3 class="section-title">الأكثر غيابًا</h3>
        <table>
          <thead><tr><th>#</th><th>الطالب</th><th>الصف</th><th>الغياب</th></tr></thead>
          <tbody id="topAbsentBody"></tbody>
        </table>
      </div>

      <div class="card">
        <h3 class="section-title">سجل غياب طالب</h3>
        <label>اختر الطالب</label>
        <select id="historyStudent" onchange="loadStudentHistory()"></select>
        <div id="historySummary" class="muted" style="margin:12px 0"></div>
        <table>
          <thead><tr><th>التاريخ</th><th>الصف وقت الغياب</th></tr></thead>
          <tbody id="historyBody"><tr><td colspan="2" class="empty">اختر طالبًا</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
const API='https://lpskxevggdiwhtqgazvs.supabase.co/functions/v1/attendance-api';
let classes=[],students=[],dates=[];

async function api(action,payload={}){
  const r=await fetch(API,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({action,...payload})
  });
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(d.error||'فشل الاتصال');
  return d;
}

window.addEventListener('DOMContentLoaded',init);

async function init(){
  try{
    const [c,d,s]=await Promise.all([
      api('classes'),
      api('dates'),
      api('students_admin')
    ]);
    classes=c.classes||[];
    dates=d.dates||[];
    students=s.students||[];
    fillSelectors();
    await loadReport();
  }catch(e){alert(e.message)}
}

function classOrder(name){
  const order=['الثاني','الثالث','الرابع أ','الرابع ب','الخامس أ','الخامس ب','الخامس ج','السادس أ','السادس ب','السادس ج','السابع أ','السابع ب','السابع ج','الثامن أ','الثامن ب','الثامن ج'];
  const i=order.indexOf(name); return i===-1?999:i;
}

function fillSelectors(){
  const classNames=classes.map(c=>c.class_name).sort((a,b)=>classOrder(a)-classOrder(b));
  const report=document.getElementById('classFilter');
  report.innerHTML='<option value="">كل الصفوف</option>'+classNames.map(c=>'<option value="'+esc(c)+'">'+esc(c)+'</option>').join('');

  const studentFilter=document.getElementById('studentClassFilter');
  studentFilter.innerHTML=classNames.map(c=>'<option value="'+esc(c)+'">'+esc(c)+'</option>').join('');

  const add=document.getElementById('newClass');
  add.innerHTML=classNames.map(c=>'<option value="'+esc(c)+'">'+esc(c)+'</option>').join('');

  const dateSel=document.getElementById('dateFilter');
  if(dates.length){
    dateSel.innerHTML=dates.map(d=>'<option value="'+d+'">'+formatDate(d)+'</option>').join('');
  }else{
    const today=localDateISO();
    dateSel.innerHTML='<option value="'+today+'">'+formatDate(today)+'</option>';
  }

  fillHistoryStudents();
}

function showTab(t){
  for(const name of ['reports','students','analytics']){
    document.getElementById(name+'Panel').classList.toggle('active',name===t);
    document.getElementById('tab'+cap(name)).classList.toggle('active',name===t);
  }
  if(t==='students') renderStudents();
  if(t==='analytics') loadAnalytics();
}

function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}

async function loadReport(){
  const date=document.getElementById('dateFilter').value;
  const className=document.getElementById('classFilter').value;
  try{
    const d=await api('report',{from:date,to:date,className});
    const rows=d.rows||[];
    document.getElementById('reportBody').innerHTML=rows.length
      ?rows.map(r=>'<tr><td>'+esc(r.className)+'</td><td>'+esc(r.name)+'</td></tr>').join('')
      :'<tr><td colspan="2" class="empty">لا يوجد غياب في هذا الاختيار</td></tr>';
    document.getElementById('kpiCount').textContent=rows.length;
    document.getElementById('kpiClasses').textContent=new Set(rows.map(r=>r.className)).size;
  }catch(e){alert(e.message)}
}

function renderStudents(){
  const cls=document.getElementById('studentClassFilter').value;
  const q=document.getElementById('studentSearch').value.trim();
  const rows=students
    .filter(s=>s.active && s.class_name===cls && (!q || s.name.includes(q)))
    .sort((a,b)=>a.name.localeCompare(b.name,'ar'));

  document.getElementById('studentsBody').innerHTML=rows.length?rows.map(s=>{
    const targetOptions=getTransferTargets(s.class_name).map(c=>'<option value="'+esc(c)+'">'+esc(c)+'</option>').join('');
    return '<tr>'+
      '<td>'+esc(s.name)+'</td>'+
      '<td><span class="badge">'+esc(s.class_name)+'</span></td>'+
      '<td><select id="move_'+s.id+'" style="min-width:110px">'+targetOptions+'</select> <button class="btn secondary" onclick="moveStudent('+s.id+')">نقل</button></td>'+
      '<td><button class="btn secondary" onclick="editStudent('+s.id+')">تعديل الاسم</button> <button class="btn danger" onclick="removeStudent('+s.id+')">إزالة</button></td>'+
      '</tr>';
  }).join(''):'<tr><td colspan="4" class="empty">لا يوجد طلاب</td></tr>';
}

function getTransferTargets(cls){
  const grade=cls.replace(/ [أبج]$/,'');
  const candidates=classes.map(c=>c.class_name).filter(c=>c!==cls && c.replace(/ [أبج]$/,'')===grade);
  return candidates;
}

async function moveStudent(id){
  const s=students.find(x=>Number(x.id)===Number(id));
  if(!s)return;
  const sel=document.getElementById('move_'+id);
  if(!sel || !sel.value){alert('لا توجد شعبة أخرى لهذا الصف');return}
  const target=sel.value;
  if(!confirm('نقل '+s.name+' من '+s.class_name+' إلى '+target+'؟'))return;
  try{
    const d=await api('student_update',{id,className:target});
    Object.assign(s,d.student);
    refreshClassCounts();
    renderStudents();
    fillHistoryStudents();
  }catch(e){alert(e.message)}
}

async function editStudent(id){
  const s=students.find(x=>Number(x.id)===Number(id)); if(!s)return;
  const name=prompt('اسم الطالب',s.name); if(name===null)return;
  const clean=name.trim(); if(!clean)return;
  try{
    const d=await api('student_update',{id,name:clean});
    Object.assign(s,d.student);
    renderStudents();fillHistoryStudents();
  }catch(e){alert(e.message)}
}

async function removeStudent(id){
  const s=students.find(x=>Number(x.id)===Number(id)); if(!s)return;
  if(!confirm('إزالة الطالب '+s.name+' من القوائم الحالية؟\nسيبقى سجل غياباته السابق محفوظًا.'))return;
  try{
    const d=await api('student_update',{id,active:false});
    Object.assign(s,d.student);
    refreshClassCounts();
    renderStudents();
    fillHistoryStudents();
  }catch(e){alert(e.message)}
}

async function addStudent(){
  const name=document.getElementById('newName').value.trim();
  const className=document.getElementById('newClass').value;
  if(!name){alert('اكتب اسم الطالب');return}
  try{
    const d=await api('student_add',{name,className});
    students.push(d.student);
    document.getElementById('newName').value='';
    document.getElementById('studentClassFilter').value=className;
    refreshClassCounts();
    renderStudents();
    fillHistoryStudents();
  }catch(e){alert(e.message)}
}

function refreshClassCounts(){
  classes=classes.map(c=>({
    ...c,
    count:students.filter(s=>s.active && s.class_name===c.class_name).length
  }));
}

async function loadAnalytics(){
  await Promise.all([loadTopAbsent(),loadStudentHistory()]);
}

async function loadTopAbsent(){
  try{
    const d=await api('top_absent');
    const rows=d.rows||[];
    document.getElementById('topAbsentBody').innerHTML=rows.length?rows.map((r,i)=>
      '<tr><td class="rank">'+(i+1)+'</td><td>'+esc(r.name)+'</td><td>'+esc(r.className)+'</td><td><span class="badge red">'+r.count+'</span></td></tr>'
    ).join(''):'<tr><td colspan="4" class="empty">لا توجد بيانات غياب بعد</td></tr>';
  }catch(e){alert(e.message)}
}

function fillHistoryStudents(){
  const sel=document.getElementById('historyStudent');
  const active=students.filter(s=>s.active).sort((a,b)=>a.name.localeCompare(b.name,'ar'));
  sel.innerHTML='<option value="">اختر طالبًا</option>'+active.map(s=>'<option value="'+s.id+'">'+esc(s.name)+' — '+esc(s.class_name)+'</option>').join('');
}

async function loadStudentHistory(){
  const id=Number(document.getElementById('historyStudent').value);
  if(!id){
    document.getElementById('historySummary').textContent='';
    document.getElementById('historyBody').innerHTML='<tr><td colspan="2" class="empty">اختر طالبًا</td></tr>';
    return;
  }
  try{
    const d=await api('student_history',{studentId:id});
    const rows=d.rows||[];
    document.getElementById('historySummary').textContent=d.student.name+' — مجموع الغيابات: '+rows.length;
    document.getElementById('historyBody').innerHTML=rows.length?rows.map(r=>
      '<tr><td>'+formatDate(r.attendance_date)+'</td><td>'+esc(r.class_name)+'</td></tr>'
    ).join(''):'<tr><td colspan="2" class="empty">لا يوجد غياب مسجل لهذا الطالب</td></tr>';
  }catch(e){alert(e.message)}
}

function localDateISO(){
  const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function formatDate(v){
  if(!v)return '';
  const p=v.split('-'); if(p.length!==3)return v;
  return new Date(Number(p[0]),Number(p[1])-1,Number(p[2])).toLocaleDateString('ar-JO',{weekday:'short',year:'numeric',month:'short',day:'numeric'});
}
function esc(v){
  return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
</script>
</body>
</html>
